version = '3.1.2+fabric.1.20.1'

base {
    archivesName = 'ntgl'
}

// Forge data generators are build-time tools; their generated resources remain
// part of the mod.
sourceSets.main.java.exclude 'com/nukateam/ntgl/common/datagen/**'

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    modImplementation 'fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.2'
    modImplementation 'software.bernie.geckolib:geckolib-fabric-1.20.1:4.8.2'
    modImplementation 'me.shedaniel.cloth:cloth-config-fabric:11.1.118'
    modImplementation 'io.github.fabricators_of_create.Porting-Lib:fluids:2.3.2+1.20.1'
    modImplementation 'io.github.fabricators_of_create.Porting-Lib:entity:2.3.13+1.20.1'
    implementation 'com.eliotlash.mclib:mclib:20'
    modCompileOnly 'dev.kosmx.player-anim:player-animation-lib-fabric:1.0.2-rc1+1.20'
    modCompileOnly 'mezz.jei:jei-1.20.1-fabric-api:15.20.0.106'
    modCompileOnly 'maven.modrinth:ouNrBQtq:Jk6o7s4h'
    modCompileOnly 'maven.modrinth:zO7tsTJN:PQc88S7k'
    modCompileOnly 'maven.modrinth:9jxwkYQL:BP3CQI2v'
    modCompileOnly 'maven.modrinth:rlloIFEV:G60CBuLj'
    modCompileOnly 'maven.modrinth:4q8UOK1d:z2FCyolJ'
    modCompileOnly 'dev.emi:trinkets:3.7.2'
    modCompileOnly 'curse.maven:backpacked-fabric-667380:7300458'
    modCompileOnly 'curse.maven:controllable-fabric-851657:4592466'
    modCompileOnly 'curse.maven:framework-549225:5098259'
    modCompileOnly 'io.github.fabricators_of_create.Porting-Lib:transfer:2.3.2+1.20.1'
    modCompileOnly 'io.github.fabricators_of_create.Porting-Lib:core:2.3.2+1.20.1'
    modCompileOnly 'maven.modrinth:hYykXjDp:X97pZsBz'
}
